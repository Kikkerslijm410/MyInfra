<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyInfra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyInfra" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />
</head>

<body>
    <header class="topbar">
        <div class="brand"><i class="fa-solid fa-server"></i> MyInfra</div>

        <nav class="main-tabs">
            <button class="main-tab-btn active" data-tab="home" data-i18n="tab_home">Home</button>
            <button class="main-tab-btn" data-tab="tasks" data-i18n="tab_tasks">Tasks</button>
        </nav>

        <button id="settings-btn" class="icon-btn" title="Settings"><i class="fa-solid fa-gear"></i></button>
    </header>

    <div class="app-shell">
        <main>
            <!-- HOME TAB -->
            <div id="main-tab-home" class="main-tab-panel">
                <!-- WEBSITES SECTION -->
                <section id="section-websites" class="page-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-globe"></i> <span data-i18n="websites_title">Websites</span></h2>
                    <button id="add-website-btn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> <span data-i18n="add_website">Add website</span></button>
                </div>
                <div id="groups-container"></div>
                </section>

                <!-- WIDGETS SECTION -->
                <section id="section-widgets" class="page-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-table-cells-large"></i> <span data-i18n="widgets_title">Widgets</span></h2>
                    <button id="add-widget-btn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> <span data-i18n="add_widget">Add widget</span></button>
                </div>
                <div id="widgets-container" class="widgets-list"></div>
                </section>

                <!-- CHECKS SECTION -->
                <section id="section-checks" class="page-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-shield-halved"></i> <span data-i18n="checks_title">Checks</span></h2>
                    <button id="manage-checks-btn" class="btn btn-primary"><i class="fa-solid fa-sliders"></i> <span data-i18n="manage_checks">Manage checks</span></button>
                </div>
                <div id="checks-container" class="checks-list"></div>
                </section>
            </div>

            <!-- TASKS TAB -->
            <div id="main-tab-tasks" class="main-tab-panel hidden">
                <section id="section-tasks" class="page-section">
                    <div class="section-header">
                        <h2><i class="fa-solid fa-list-check"></i> <span data-i18n="tasks_title">Tasks</span></h2>
                        <button id="add-task-btn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> <span data-i18n="add_task">Add task</span></button>
                    </div>

                    <div class="tasks-toolbar">
                        <input id="tasks-search" type="text" data-i18n-placeholder="search_tasks_placeholder" placeholder="Search tasks (title, description, notes)...">
                        <select id="tasks-status-filter">
                            <option value="" data-i18n="all_statuses">All statuses</option>
                        </select>
                        <button id="tasks-clear-item-filter" class="btn hidden" title="Clear website filter">
                            <i class="fa-solid fa-xmark"></i> <span id="tasks-item-filter-label"></span>
                        </button>
                    </div>

                    <div id="tasks-list" class="task-list"></div>
                </section>
            </div>
        </main>

        <footer class="footer">
            <a href="https://github.com/Kikkerslijm410/MyInfra" target="_blank" class="github-link">
                <i class="fab fa-github"></i> <span data-i18n="github_link">GitHub</span>
            </a>
            <a href="https://github.com/Kikkerslijm410?tab=repositories" target="_blank" class="github-link">
                <i class="fa-solid fa-code"></i> <span data-i18n="more_projects">More projects</span>
            </a>
        </footer>
    </div>

    <!-- ADD/EDIT APP MODAL -->
    <div id="item-modal" class="modal-overlay hidden">
        <div class="modal">
            <h3 id="item-modal-title">Add app</h3>

            <label data-i18n="predefined_app">Predefined app</label>
            <select id="predefined-select">
                <option value="" data-i18n="custom_option">-- Custom --</option>
            </select>

            <label data-i18n="name_label">Name</label>
            <input id="item-name" type="text" placeholder="e.g. MeTify">

            <label data-i18n="icon_label">Icon</label>
            <div class="icon-picker">
                <div class="icon-preview" id="icon-preview">
                    <i class="fa-solid fa-image"></i>
                </div>
                <div class="icon-picker-fields">
                    <label class="upload-btn" for="icon-file-input">
                        <i class="fa-solid fa-upload"></i> <span data-i18n="upload_image">Upload image</span>
                    </label>
                    <input id="icon-file-input" type="file" accept="image/*" class="hidden">
                    <span id="icon-filename-label" class="icon-filename-label"></span>
                </div>
            </div>
            <input type="hidden" id="item-icon">

            <label data-i18n="group_label">Group</label>
            <input id="item-group-name" list="group-options" type="text" placeholder="Existing or new group name">
            <datalist id="group-options"></datalist>

            <div class="field-row">
                <div>
                    <label data-i18n="local_ip_label">Local IP (optional)</label>
                    <input id="item-local-ip" type="text" placeholder="192.168.1.10">
                </div>
                <div class="field-small">
                    <label data-i18n="port_label">Port</label>
                    <input id="item-port" type="text" placeholder="8989">
                </div>
            </div>

            <label data-i18n="public_domain_label">Public domain (optional)</label>
            <input id="item-domain" type="text" placeholder="app.example.com">

            <label class="switch-row" style="margin-top:16px;">
                <span data-i18n="exclude_from_checks_label">Exclude from checks</span>
                <span class="switch">
                    <input type="checkbox" id="item-checks-excluded">
                    <span class="slider"></span>
                </span>
            </label>

            <input type="hidden" id="item-id">

            <div class="modal-actions">
                <button id="item-delete-btn" class="btn btn-danger hidden"><i class="fa-solid fa-trash"></i></button>
                <button id="item-cancel-btn" class="btn" data-i18n="cancel">Cancel</button>
                <button id="item-save-btn" class="btn btn-primary" data-i18n="save">Save</button>
            </div>
        </div>
    </div>

    <!-- ADD/EDIT TASK MODAL -->
    <div id="task-modal" class="modal-overlay hidden">
        <div class="modal modal-wide">
            <h3 id="task-modal-title">Add task</h3>

            <div class="task-modal-grid">
                <div class="task-modal-main">
                    <label data-i18n="title_label">Title</label>
                    <input id="task-title" type="text" placeholder="e.g. Renew SSL certificate">

                    <label data-i18n="description_label">Description</label>
                    <textarea id="task-description" rows="4" placeholder="What needs to be done?"></textarea>

                    <div class="field-row">
                        <div>
                            <label data-i18n="status_label">Status</label>
                            <select id="task-status"></select>
                        </div>
                        <div>
                            <label data-i18n="due_date_label">Due date</label>
                            <input id="task-due-date" type="date">
                        </div>
                    </div>

                    <label data-i18n="linked_website_label">Linked website (optional)</label>
                    <select id="task-item">
                        <option value="" data-i18n="none_option">-- None --</option>
                    </select>

                    <div id="task-dates-info" class="task-dates-info"></div>
                </div>

                <div class="task-modal-notes">
                    <label data-i18n="notes_label">Notes</label>

                    <div id="task-notes-hint" class="task-notes-hint hidden" data-i18n="notes_save_first">
                        Save the task to start adding notes.
                    </div>

                    <div id="task-notes-section">
                        <div id="task-notes-list" class="task-notes-list"></div>
                        <div class="task-note-add-row">
                            <textarea id="task-note-input" rows="2" data-i18n-placeholder="note_placeholder" placeholder="Add a note..."></textarea>
                            <button id="task-note-add-btn" class="btn btn-primary" type="button" data-i18n="add_note">Add note</button>
                        </div>
                    </div>
                </div>
            </div>

            <input type="hidden" id="task-id">

            <div class="modal-actions">
                <button id="task-delete-btn" class="btn btn-danger hidden"><i class="fa-solid fa-trash"></i></button>
                <button id="task-cancel-btn" class="btn" data-i18n="cancel">Cancel</button>
                <button id="task-save-btn" class="btn btn-primary" data-i18n="save">Save</button>
            </div>
        </div>
    </div>

    <!-- VIEW TASK MODAL: title/status/edit up top, description, website + dates on the side, stacked notes below -->
    <div id="task-view-modal" class="modal-overlay hidden">
        <div class="modal modal-wide">
            <input id="task-view-id" type="hidden">

            <div class="task-view-header">
                <span id="task-view-status" class="status-badge"></span>
                <h3 id="task-view-title" class="task-view-title"></h3>
                <button id="task-view-edit-btn" class="task-view-edit-btn" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
            </div>

            <div id="task-view-description" class="task-view-description"></div>

            <div class="task-view-grid">
                <div id="task-view-website" class="task-view-info-box hidden">
                    <i class="fa-solid fa-link"></i> <span id="task-view-website-name"></span>
                </div>
                <div class="task-view-info-box">
                    <div id="task-view-dates"></div>
                </div>
            </div>

            <label data-i18n="notes_label">Notes</label>
            <div id="task-view-notes-list" class="task-notes-list"></div>
            <div class="task-note-add-row">
                <textarea id="task-view-note-input" rows="2" data-i18n-placeholder="note_placeholder" placeholder="Add a note..."></textarea>
                <button id="task-view-note-add-btn" class="btn btn-primary" type="button" data-i18n="add_note">Add note</button>
            </div>

            <div class="modal-actions">
                <button id="task-view-close-btn" class="btn" data-i18n="close">Close</button>
            </div>
        </div>
    </div>

    <!-- ADD/EDIT WIDGET MODAL -->
    <div id="widget-modal" class="modal-overlay hidden">
        <div class="modal">
            <h3 id="widget-modal-title">Add widget</h3>

            <label data-i18n="widget_type_label">Widget type</label>
            <select id="widget-type">
                <option value="weather" data-i18n="widget_type_weather">Weather</option>
                <option value="tasks" data-i18n="widget_type_tasks">Tasks</option>
            </select>

            <!-- Weather config -->
            <div id="widget-config-weather">
                <label data-i18n="location_label">Location</label>
                <input id="widget-weather-search" type="text" data-i18n-placeholder="search_city_placeholder" placeholder="Search a city...">
                <div id="widget-weather-results" class="location-results"></div>
                <div id="widget-weather-selected" class="location-selected hidden"></div>

                <label data-i18n="days_to_show_label">Days to show</label>
                <select id="widget-weather-days">
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5" selected>5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            </div>

            <!-- Tasks config -->
            <div id="widget-config-tasks" class="hidden">
                <label data-i18n="show_first_label">Show first</label>
                <select id="widget-tasks-sort">
                    <option value="due_date" data-i18n="sort_due_date">First due date</option>
                    <option value="in_progress" data-i18n="sort_in_progress">In progress</option>
                    <option value="recent" data-i18n="sort_recent">Recently created</option>
                </select>

                <label data-i18n="task_count_label">Number of tasks</label>
                <input id="widget-tasks-limit" type="number" min="1" max="20" value="5">
            </div>

            <input type="hidden" id="widget-id">

            <div class="modal-actions">
                <button id="widget-delete-btn" class="btn btn-danger hidden"><i class="fa-solid fa-trash"></i></button>
                <button id="widget-cancel-btn" class="btn" data-i18n="cancel">Cancel</button>
                <button id="widget-save-btn" class="btn btn-primary" data-i18n="save">Save</button>
            </div>
        </div>
    </div>

    <!-- MANAGE CHECKS MODAL -->
    <div id="checks-manage-modal" class="modal-overlay hidden">
        <div class="modal">
            <h3><i class="fa-solid fa-sliders"></i> <span data-i18n="manage_checks_title">Manage checks</span></h3>
            <div id="checks-manage-list"></div>
            <div class="modal-actions">
                <button id="checks-manage-cancel-btn" class="btn" data-i18n="cancel">Cancel</button>
                <button id="checks-manage-save-btn" class="btn btn-primary" data-i18n="save">Save</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal">
            <h3><i class="fa-solid fa-gear"></i> <span data-i18n="settings_title">Settings</span></h3>

            <h4 data-i18n="colors_title">Colors</h4>
            <div class="color-grid">
                <label><span data-i18n="color_primary">Primary</span> <input type="color" id="color-primary"></label>
                <label><span data-i18n="color_background">Background</span> <input type="color" id="color-background"></label>
                <label><span data-i18n="color_surface">Surface</span> <input type="color" id="color-surface"></label>
                <label><span data-i18n="color_text">Text</span> <input type="color" id="color-text"></label>
            </div>

            <h4 data-i18n="language_title">Language</h4>
            <select id="settings-language">
                <option value="en">English</option>
                <option value="nl">Nederlands</option>
            </select>

            <h4 data-i18n="backup_restore_title">Backup & Restore</h4>
            <div class="modal-actions" style="justify-content:flex-start; gap:8px; margin-top:0;">
                <button id="backup-btn" class="btn"><i class="fa-solid fa-download"></i> <span data-i18n="download_backup">Download backup</span></button>
                <label for="restore-file-input" class="btn upload-btn" style="margin:0; padding:9px 16px;">
                    <i class="fa-solid fa-upload"></i> <span data-i18n="restore_backup">Restore backup</span>
                </label>
                <input id="restore-file-input" type="file" accept=".db" class="hidden">
            </div>

            <div class="modal-actions">
                <button id="settings-cancel-btn" class="btn" data-i18n="cancel">Cancel</button>
                <button id="settings-save-btn" class="btn btn-primary" data-i18n="save">Save</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
